<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AstroQuiz: Space Exploration</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="stars"></div>
    <div class="app-container">
        <!-- Home Screen -->
        <div id="home-screen" class="screen active">
            <h1 class="logo">🚀 AstroQuiz</h1>
            <p class="subtitle">ब्रह्मांड के रहस्यों को अनलॉक करें</p>
            
            <div class="levels-container">
                <button class="level-btn" onclick="startQuiz('moon')">🌕 लेवल 1: मून मिशन (Free)</button>
                <button class="level-btn" onclick="startQuiz('mars')">🔴 लेवल 2: मार्स मिशन (Free)</button>
                <button class="level-btn locked" onclick="showLockedMessage()">🌌 लेवल 3: ब्लैक होल (Locked)</button>
            </div>
            
            <p class="footer-text">Made with ❤️ for Space Lovers</p>
        </div>

        <!-- Quiz Screen -->
        <div id="quiz-screen" class="screen">
            <div class="quiz-header">
                <span id="quiz-title">लेवल</span>
                <span id="score-display">स्कोर: 0</span>
            </div>
            
            <div class="progress-bar"><div id="progress"></div></div>

            <div class="question-box">
                <p id="question-text">सवाल यहाँ दिखाई देगा...</p>
            </div>

            <div id="options-container" class="options-grid">
                <!-- Buttons will be injected by JavaScript -->
            </div>

            <div id="fact-box" class="fact-box hidden">
                <p id="fact-text"></p>
                <button class="next-btn" onclick="nextQuestion()">अगला सवाल ➡️</button>
            </div>
        </div>

        <!-- Score Screen -->
        <div id="score-screen" class="screen">
            <h2>🎯 क्विज पूरा हुआ!</h2>
            <div class="final-score-card">
                <p>आपका कुल स्कोर</p>
                <h1 id="final-score">0/5</h1>
            </div>
            <p id="score-message"></p>
            <button class="home-btn" onclick="goToHome()">मुख्य स्क्रीन पर जाएं 🏠</button>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
